# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: cacahuate-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ConnectionStrings__DefaultConnection
        sync: false            # Neon connection string, entered in the dashboard
      - key: Jwt__Key
        generateValue: true    # Render generates a random secret
      - key: Cors__AllowedOrigins
        sync: false            # e.g. https://cacahuate.pages.dev
      - key: Seed__DemoData
        value: "true"          # demo users/appointments for the initial test
